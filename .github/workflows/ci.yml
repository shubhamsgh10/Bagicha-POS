name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # DB-free unit checks (pricing anti-tamper + PIN elevation). Other
      # scripts/verify-*.ts touch a live DB/settings, so they stay manual.
      - name: Pure-logic tests
        run: npm run test:pure
