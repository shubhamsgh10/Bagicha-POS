# Bagicha POS — Electron release workflow
#
# Trigger: push a git tag matching v* (e.g. v1.0.2)
# Result:  Windows installer + macOS dmg/zip uploaded to GitHub Releases, each with its
#          own latest.yml/latest-mac.yml (electron-updater on POS machines picks up the
#          new version automatically, per-platform)
#
# Required secret: GH_TOKEN (GitHub personal access token with repo + write:packages scope)
# Set it at: repo → Settings → Secrets and variables → Actions → New repository secret
#
# macOS build is UNSIGNED (no Apple Developer ID cert configured) — electron-builder still
# ad-hoc signs automatically (required for Apple Silicon to launch the app at all), but users
# see a Gatekeeper "unidentified developer" prompt on first launch: right-click the app → Open
# once to bypass it. Add CSC_LINK/CSC_KEY_PASSWORD secrets + a Developer ID cert later to sign
# properly and remove that prompt.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:electron
        env:
          ELECTRON_BUILD: '1'
          # Bake your production API URL into the desktop build
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Pusher realtime — lets the installed desktop app receive PRINT_JOB
          # broadcasts so a phone (on Vercel) can print on this machine's thermal
          # printer. These are the PUBLIC client keys (the key ships in the browser
          # bundle anyway), so they are safe to inline here.
          # This key was rotated on 2026-07-15 (old key ce1d9880... is stale/dead —
          # do NOT restore it). If you rotate again, this literal must be updated too;
          # nothing here validates it against Vercel's PUSHER_KEY automatically.
          VITE_PUSHER_KEY: 2ae00b4088c21f96fa75
          VITE_PUSHER_CLUSTER: ap2
          # Private channel — subscribers must be authorized via /api/pusher/auth.
          # The host server's PUSHER_CHANNEL must match this exactly.
          VITE_PUSHER_CHANNEL: private-bagicha-pos

      - name: Publish to GitHub Releases
        run: npx electron-builder --win --publish always --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # skip code-signing (no cert)

  release-mac:
    name: Build & publish macOS dmg/zip
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # macos-latest ships Python 3.12+, which removed the distutils module that
      # this repo's node-gyp 9.x (used by @electron/rebuild to compile the native
      # `usb` printer module) still imports. Pin 3.11, which has distutils.
      - name: Setup Python 3.11 (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:electron
        env:
          ELECTRON_BUILD: '1'
          # Bake your production API URL into the desktop build
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Pusher realtime — lets the installed desktop app receive PRINT_JOB
          # broadcasts so a phone (on Vercel) can print on this machine's thermal
          # printer. These are the PUBLIC client keys (the key ships in the browser
          # bundle anyway), so they are safe to inline here.
          # This key was rotated on 2026-07-15 (old key ce1d9880... is stale/dead —
          # do NOT restore it). If you rotate again, this literal must be updated too;
          # nothing here validates it against Vercel's PUSHER_KEY automatically.
          VITE_PUSHER_KEY: 2ae00b4088c21f96fa75
          VITE_PUSHER_CLUSTER: ap2
          # Private channel — subscribers must be authorized via /api/pusher/auth.
          # The host server's PUSHER_CHANNEL must match this exactly.
          VITE_PUSHER_CHANNEL: private-bagicha-pos

      - name: Publish to GitHub Releases
        run: npx electron-builder --mac --publish always --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # skip code-signing (no cert) — ad-hoc signed instead
