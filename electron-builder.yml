appId: com.bagicha.pos
productName: Bagicha POS
executableName: BagichaPOS
copyright: Copyright © Bagicha

# ── GitHub Releases auto-update ───────────────────────────────────────────────
# Set GH_TOKEN env var when running electron-builder to publish.
# Replace owner/repo below with your GitHub username and repository name.
publish:
  - provider: github
    owner: shubhamsgh10
    repo: Bagicha-POS
    releaseType: release
directories:
  output: release
  buildResources: desktop/icons
files:
  - dist/public/**/*
  - dist/index.js          # bundled Express server — used by the embedded host build
  - desktop/dist/**/*
  - desktop/icons/icon.png
  - desktop/icons/icon.ico
  - shared/print/scripts/**/*
  - package.json
# asar packs the app. The embedded host build overrides this to false at the CLI
# (pack:win:host → electron-builder -c.asar=false) so the spawned Node server can
# resolve dist/index.js + node_modules from the real filesystem (asar isn't
# readable by a plain ELECTRON_RUN_AS_NODE child process).
asar: true
extraMetadata:
  main: desktop/dist/main.mjs

# 512×512+ PNG; electron-builder derives platform icons (Windows uses icon.ico when present)
icon: desktop/icons/icon.png

win:
  icon: desktop/icons/icon.ico
  # Avoid winCodeSign 7z extract (symlinks need Developer Mode or admin on Windows).
  # Installer/shortcuts still use icon.ico; exe metadata uses Electron defaults.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Bagicha POS

mac:
  icon: desktop/icons/icon.png
  category: public.app-category.business
  # zip is REQUIRED alongside dmg: electron-updater uses the zip (+ latest-mac.yml)
  # to apply macOS updates. Dropping it silently kills auto-update.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Signed with a SELF-SIGNED cert (no paid Apple Developer ID). This buys a *stable*
  # code signature across builds, which is what Squirrel.Mac compares an update against
  # before applying it. Ad-hoc signatures are hash-derived and differ on every build, so
  # they can never match — that permanently breaks macOS auto-update, and no setting of
  # ours can disable that check (it lives in Apple's framework).
  # It does NOT satisfy Gatekeeper: a browser-downloaded dmg is quarantined and rejected
  # as "damaged", so the first install must arrive by USB. See docs/MAC-SIGNING.md.
  # The CN is prefixed "Developer ID Application:" deliberately — electron-builder only
  # matches identities against known Apple type names and skips anything else.
  identity: "Developer ID Application: Bagicha POS (SELFSIGNED)"
  # Hardened runtime only pays off with notarization, which needs the paid cert we don't
  # have. Leaving it on adds Gatekeeper strictness and can block native modules (usb).
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  icon: desktop/icons/icon.png
  category: Office
  target:
    - AppImage
    - deb
