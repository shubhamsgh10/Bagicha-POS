appId: com.bagicha.pos
productName: Bagicha POS
executableName: BagichaPOS
copyright: Copyright © Bagicha

# ── GitHub Releases auto-update ───────────────────────────────────────────────
# Set GH_TOKEN env var when running electron-builder to publish.
# Replace owner/repo below with your GitHub username and repository name.
publish:
  - provider: github
    owner: shubhamsgh10
    repo: Bagicha-POS
    releaseType: release
directories:
  output: release
  buildResources: desktop/icons
files:
  - dist/public/**/*
  - dist/index.js          # bundled Express server — used by the embedded host build
  - desktop/dist/**/*
  - desktop/icons/icon.png
  - desktop/icons/icon.ico
  - shared/print/scripts/**/*
  - package.json
# asar packs the app. The embedded host build overrides this to false at the CLI
# (pack:win:host → electron-builder -c.asar=false) so the spawned Node server can
# resolve dist/index.js + node_modules from the real filesystem (asar isn't
# readable by a plain ELECTRON_RUN_AS_NODE child process).
asar: true
extraMetadata:
  main: desktop/dist/main.mjs

# 512×512+ PNG; electron-builder derives platform icons (Windows uses icon.ico when present)
icon: desktop/icons/icon.png

win:
  icon: desktop/icons/icon.ico
  # Avoid winCodeSign 7z extract (symlinks need Developer Mode or admin on Windows).
  # Installer/shortcuts still use icon.ico; exe metadata uses Electron defaults.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Bagicha POS

mac:
  icon: desktop/icons/icon.png
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Unsigned build (no Apple Developer ID yet) — electron-builder still applies an
  # ad-hoc signature automatically (required for the app to launch on Apple Silicon).
  # Users see a Gatekeeper "unidentified developer" prompt on first launch; right-click
  # the app → Open once to bypass it. Revisit once a Developer ID cert is available.
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  icon: desktop/icons/icon.png
  category: Office
  target:
    - AppImage
    - deb
